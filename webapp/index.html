<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftRadar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo">
                <span class="logo-icon">🎁</span>
                <span>GiftRadar</span>
            </div>
            <button class="theme-toggle" id="theme-toggle">🌙</button>
        </div>
        <p class="subtitle">Галерея NFT-подарков Telegram</p>
    </header>

    <div class="search-bar">
        <input type="text" id="search" placeholder="🔍 Поиск подарка...">
    </div>

    <div class="filters">
        <button class="filter active" data-sort="popular">🔥 Все</button>
        <button class="filter" data-sort="cheap">💰 Дешёвые</button>
        <button class="filter" data-sort="expensive">💎 Дорогие</button>
    </div>

    <div id="gifts" class="grid">
        <div class="loading">Загрузка...</div>
    </div>

    <div id="toast" class="toast"></div>
    <div id="flying-gift" class="flying-gift">🎁</div>

    <script src="nft.js"></script>
</body>
</html>
